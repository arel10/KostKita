<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f7f4"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e9f1ed"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#004337" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Elements -->
  <circle cx="120" cy="100" r="180" fill="#004337" fill-opacity="0.03"/>
  <circle cx="720" cy="500" r="220" fill="#004337" fill-opacity="0.03"/>

  <!-- Center Card -->
  <g transform="translate(400, 275)">
    <!-- Icon Container Box -->
    <rect x="-60" y="-100" width="120" height="120" rx="32" fill="url(#iconBg)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Building / Kost Icon -->
    <g transform="translate(0, -42)" fill="none" stroke="#004337" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-28 -4 L0 -26 L28 -4 L28 22 C28 25 25 28 22 28 L-22 28 C-25 28 -28 25 -28 22 Z"/>
      <rect x="-14" y="-2" width="10" height="10" rx="2" stroke-width="2"/>
      <rect x="4" y="-2" width="10" height="10" rx="2" stroke-width="2"/>
      <rect x="-14" y="14" width="10" height="10" rx="2" stroke-width="2"/>
      <rect x="4" y="14" width="10" height="10" rx="2" stroke-width="2"/>
    </g>

    <!-- Camera badge overlay on bottom right of icon box -->
    <circle cx="34" cy="-10" r="18" fill="#004337" stroke="#ffffff" stroke-width="3"/>
    <g transform="translate(34, -10) scale(0.65)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 -4 L-7 -9 L7 -9 L10 -4 L13 -4 C14.5 -4 16 -2.5 16 -1 L16 10 C16 11.5 14.5 13 13 13 L-13 13 C-14.5 13 -16 11.5 -16 10 L-16 -1 C-16 -2.5 -14.5 -4 -13 -4 Z"/>
      <circle cx="0" cy="4" r="5"/>
    </g>

    <!-- Main Title -->
    <text y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Poppins', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b" letter-spacing="-0.3">
      Belum Ada Foto Properti
    </text>

    <!-- Subtitle -->
    <text y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Poppins', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Foto unit kost akan segera diunggah oleh pemilik
    </text>

    <!-- KostKita Brand Pill -->
    <g transform="translate(0, 142)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="-45" cy="0" r="4.5" fill="#10b981"/>
      <text x="-32" y="4" font-family="'Plus Jakarta Sans', 'Poppins', sans-serif" font-size="11" font-weight="800" fill="#004337" letter-spacing="1">
        KOSTKITA
      </text>
    </g>
  </g>
</svg>
